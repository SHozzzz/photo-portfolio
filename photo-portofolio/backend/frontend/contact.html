<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/reset.css">

</head>
<body>
    <header class="header">
        <h1>Maksim Doronin</h1>
        <button class="burger" id="burgerBtn">☰</button>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    
  <main>
  <h2>Связаться со мной</h2>
  <form class="contact-form" id="contactForm">
    
    <label for="name">Ваше имя</label>
    <input type="text" id="name" name="name" placeholder="Иван Иванов">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="ivan@mail.ru">

    <label for="message">Сообщение</label>
    <textarea id="message" name="message" rows="5" 
              placeholder="Расскажите о вашем проекте..."></textarea>

    <button type="submit">Отправить</button>
  </form>

  <!-- Сюда JS будет выводить сообщение -->
  <p id="formStatus"></p>
</main>

</footer>
<script src="js/main.js"></script>
</body>
